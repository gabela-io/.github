<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="colors_and_type.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1280px;height:400px;overflow:hidden;background:var(--paper)}
  .b{width:1280px;height:400px;position:relative;overflow:hidden;background:var(--paper);
     font-family:var(--font-sans);color:var(--ink);padding:52px 64px 40px;display:grid;
     grid-template-columns:1fr 440px;column-gap:56px}
  .b::before{content:"";position:absolute;inset:0;opacity:.06;
     background:radial-gradient(circle at 1px 1px,var(--ink) 1.4px,transparent 1.4px) 0 0/24px 24px}
  .b::after{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background:var(--rojo)}
  .l{position:relative;display:flex;flex-direction:column;min-width:0}
  .brand{display:flex;align-items:center;gap:14px;margin-bottom:auto}
  .iso{width:46px;height:46px;border-radius:9px;background:var(--rojo);color:#FBF8F0;display:grid;place-items:center;
       font-weight:900;font-size:27px;letter-spacing:-2px;line-height:1;padding-bottom:3px;box-shadow:3px 3px 0 var(--shadow-c)}
  .crumb{font-family:var(--font-mono);font-weight:600;font-size:19px;color:var(--ink-3)}
  .crumb b{color:var(--ink);font-weight:700}
  .crumb .dot{color:var(--rojo)}
  .kicker{font-family:var(--font-mono);font-weight:600;font-size:16px;letter-spacing:.14em;text-transform:uppercase;color:var(--rojo);margin-bottom:10px}
  .name{font-weight:900;font-size:var(--fs,112px);line-height:.9;letter-spacing:-.045em;margin-bottom:24px;white-space:nowrap}
  .name .dot{color:var(--rojo)}
  .head{font-weight:700;font-size:27px;line-height:1.18;letter-spacing:-.015em;color:var(--ink-2);max-width:640px;text-wrap:balance}
  .head em{font-style:normal;color:var(--rojo)}
  .r{position:relative;align-self:center}
  .card{background:var(--paper-2);border:2.5px solid var(--ink);box-shadow:8px 8px 0 var(--shadow-c)}
  .card .hd{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:2.5px solid var(--ink);
       font-family:var(--font-mono);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase}
  .card .hd .tag{background:var(--rojo);color:#FBF8F0;padding:3px 8px;letter-spacing:.08em}
  .row{display:grid;grid-template-columns:44px 1fr;border-bottom:1.5px solid var(--line-strong)}
  .row:last-child{border-bottom:0}
  .row .n{font-family:var(--font-mono);font-weight:700;font-size:13px;color:var(--rojo);padding:13px 0 0 18px}
  .row .c{padding:10px 18px 11px 4px;border-left:1.5px solid var(--line-strong);padding-left:14px}
  .row .k{font-family:var(--font-mono);font-weight:600;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-bottom:2px}
  .row .v{font-weight:700;font-size:18.5px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .v small{font-family:var(--font-mono);font-weight:500;font-size:14px;color:var(--ink-2);letter-spacing:0}
  :root{--shadow-c:#1B1712}
  [data-theme="dark"]{--shadow-c:#000}
  [data-theme="dark"] .card{border-color:var(--ink-3)}
  [data-theme="dark"] .card .hd{border-color:var(--ink-3)}
</style></head>
<body>
<div class="b" id="b">
  <div class="l">
    <div class="brand"><div class="iso">gb</div><div class="crumb" id="crumb"></div></div>
    <div class="kicker" id="kicker"></div>
    <div class="name" id="name"></div>
    <div class="head" id="head"></div>
  </div>
  <div class="r"><div class="card">
    <div class="hd"><span id="form"></span><span class="tag" id="tag"></span></div>
    <div id="rows"></div>
  </div></div>
</div>
<script>
  const c = JSON.parse(decodeURIComponent(location.hash.slice(1)));
  if (c.theme === 'dark') document.documentElement.dataset.theme = 'dark';
  const $ = id => document.getElementById(id);
  $('crumb').innerHTML = c.crumb;
  $('kicker').textContent = c.kicker;
  $('name').innerHTML = c.name + '<span class="dot">.</span>';
  if (c.fs) $('name').style.setProperty('--fs', c.fs + 'px');
  $('head').innerHTML = c.head;
  $('form').textContent = c.form;
  $('tag').textContent = c.tag;
  $('rows').innerHTML = c.rows.map((r, i) =>
    `<div class="row"><div class="n">${String(i + 1).padStart(2, '0')}</div><div class="c"><div class="k">${r[0]}</div><div class="v">${r[1]}</div></div></div>`).join('');
</script>
</body></html>
